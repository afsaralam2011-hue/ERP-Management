<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    
    <!-- Viewport for Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#005461" />
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spiral Section">
    
    <!-- Description -->
    <meta
      name="description"
      content="Pakistan Wire Industries - Management System"
    />
    
    <!-- Mobile Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    
    <!-- Manifest for PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts for Better Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <title>Pakistan Wire Industries</title>
    
    <!-- Critical CSS for Fast Loading -->
    <style>
      /* Base Mobile Optimizations */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      /* Allow text selection for inputs */
      input, textarea, select {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
        font-size: 16px; /* Prevent iOS zoom */
      }
      
      html {
        font-size: 14px;
        height: 100%;
        overflow-x: hidden;
      }
      
      @media (min-width: 768px) {
        html {
          font-size: 16px;
        }
      }
      
      /* Body Styles */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1e293b;
        line-height: 1.5;
        height: 100%;
        overflow-x: hidden;
        touch-action: manipulation;
      }
      
      /* Root Container */
      #root {
        height: 100%;
        min-height: 100vh;
      }
      
      /* Welcome Screen Styles */
      .welcome-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #005461, #018790);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        text-align: center;
        padding: 2rem;
        transition: opacity 0.5s ease;
      }
      
      .welcome-logo {
        width: 150px;
        height: 150px;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
      }
      
      .welcome-logo img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      
      .welcome-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        letter-spacing: 1px;
      }
      
      .welcome-subtitle {
        font-size: 1.2rem;
        opacity: 0.9;
        margin-bottom: 2rem;
        max-width: 600px;
      }
      
      .countdown-timer {
        font-size: 3rem;
        font-weight: bold;
        margin: 2rem 0;
        color: #00B7B5;
        text-shadow: 0 2px 10px rgba(0, 183, 181, 0.3);
      }
      
      .progress-bar {
        width: 300px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        margin: 2rem 0;
      }
      
      .progress-fill {
        height: 100%;
        background: #00B7B5;
        width: 0%;
        transition: width 0.3s ease;
        border-radius: 4px;
      }
      
      /* Loading States */
      .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #005461, #018790);
        color: white;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      /* Animations */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      
      /* Mobile Specific Adjustments */
      @media screen and (max-width: 768px) {
        .welcome-title {
          font-size: 2rem;
        }
        
        .welcome-subtitle {
          font-size: 1rem;
        }
        
        .welcome-logo {
          width: 120px;
          height: 120px;
        }
        
        .countdown-timer {
          font-size: 2.5rem;
        }
        
        .progress-bar {
          width: 250px;
        }
      }
    </style>
    
    <!-- Background Music (Optional) -->
    <audio id="background-music" loop>
      <source src="%PUBLIC_URL%/audio/welcome-music.mp3" type="audio/mpeg">
    </audio>
  </head>
  <body>
    <noscript>
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: hsl(359, 80%, 33%);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        z-index: 9999;
      ">
        <h1 style="margin-bottom: 1rem; color: white;">JavaScript Required</h1>
        <p style="margin-bottom: 2rem; max-width: 600px;">
          This application requires JavaScript to function properly. Please enable JavaScript in your browser settings.
        </p>
        <p style="font-size: 0.9rem; opacity: 0.8;">
          Pakistan Wire Industries - Production Management System
        </p>
      </div>
    </noscript>
    
    <!-- Welcome Screen (Initially Hidden) -->
    <div id="welcome-screen" class="welcome-screen" style="display: none;">
      <div class="welcome-logo">
        <img src="%PUBLIC_URL%/logoA" alt="Pakistan Wire Industries Logo" id="company-logo" />
      </div>
      
      <h1 class="welcome-title">Pakistan Wire Industries</h1>
      
      <p class="welcome-subtitle">
        Welcome to our Production Management System
      </p>
      
      <div class="countdown-timer" id="countdown">15</div>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      
      <p class="mb-6">Loading login in <span id="countdown-text">15</span> seconds</p>
      
      <button 
        id="skip-button" 
        class="px-6 py-3 bg-white/20 hover:bg-white/30 text-white font-semibold rounded-lg transition-all duration-300 backdrop-blur-sm border border-white/30 hover:border-white/50"
      >
        Skip & Go to Login
      </button>
      
      <div class="mt-8 text-sm opacity-70">
        <p>© 2024 Pakistan Wire Industries | All Rights Reserved</p>
      </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="app-loading" style="display: none;">
      <div class="loading-spinner"></div>
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Loading Application</h2>
      <p style="opacity: 0.8; text-align: center;">Pakistan Wire Industries Production System</p>
    </div>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Main Script -->
    <script>
      // Global variables
      let countdownInterval = null;
      let hasRedirected = false; // Flag to prevent multiple redirects
      
      // Function to check if user is authenticated (simplified version)
      function isUserAuthenticated() {
        // Check if token exists in localStorage
        return localStorage.getItem('authToken') !== null ||
               localStorage.getItem('user') !== null ||
               sessionStorage.getItem('authToken') !== null;
      }
      
      // Function to check if welcome screen should be shown
      function shouldShowWelcomeScreen() {
        // Check if user has already seen welcome screen today
        const lastWelcomeDate = localStorage.getItem('pwi_last_welcome_date');
        const today = new Date().toDateString();
        
        // Don't show if:
        // 1. User is already authenticated
        // 2. User saw welcome screen today
        // 3. User manually skipped welcome screen
        if (isUserAuthenticated()) {
          return false;
        }
        
        if (lastWelcomeDate === today) {
          return false;
        }
        
        return localStorage.getItem('pwi_welcome_skipped') !== 'true';
      }
      
      // Function to mark welcome screen as shown
      function markWelcomeScreenShown() {
        const today = new Date().toDateString();
        localStorage.setItem('pwi_last_welcome_date', today);
      }
      
      // Function to mark welcome screen as skipped
      function markWelcomeScreenSkipped() {
        localStorage.setItem('pwi_welcome_skipped', 'true');
      }
      
      // Function to trigger app-ready event
      function triggerAppReady() {
        console.log('Dispatching app-ready event...');
        const event = new CustomEvent('app-ready', {
          detail: { timestamp: new Date().toISOString() }
        });
        window.dispatchEvent(event);
        
        // Also provide a global function for React to call
        if (window.reactAppReady) {
          window.reactAppReady();
        }
      }
      
      // Function to redirect to login
      function redirectToLogin() {
        if (hasRedirected) return; // Prevent multiple redirects
        
        hasRedirected = true;
        
        // First hide welcome screen
        const welcomeScreen = document.getElementById('welcome-screen');
        if (welcomeScreen) {
          welcomeScreen.style.opacity = '0';
          setTimeout(() => {
            welcomeScreen.style.display = 'none';
          }, 500);
        }
        
        // Mark welcome as shown/skipped
        markWelcomeScreenShown();
        markWelcomeScreenSkipped();
        
        // Stop music if playing
        const backgroundMusic = document.getElementById('background-music');
        if (backgroundMusic) {
          backgroundMusic.pause();
          backgroundMusic.currentTime = 0;
        }
        
        // Clear interval if running
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        
        // Trigger app-ready event for React to handle navigation
        console.log('Triggering app-ready event for React navigation...');
        triggerAppReady();
        
        // Show loading screen briefly
        showLoadingScreen();
      }
      
      // Function to show loading screen
      function showLoadingScreen() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.display = 'flex';
          loadingScreen.style.opacity = '1';
          
          // Hide loading screen after React app loads
          setTimeout(() => {
            if (loadingScreen) {
              loadingScreen.style.opacity = '0';
              setTimeout(() => {
                loadingScreen.style.display = 'none';
              }, 500);
            }
          }, 1000);
        }
      }
      
      // Function to start welcome screen
      function startWelcomeScreen() {
        // Check if welcome screen should be shown
        if (!shouldShowWelcomeScreen()) {
          console.log('Skipping welcome screen - user already authenticated or saw it today');
          showLoadingScreen();
          triggerAppReady();
          return;
        }
        
        const welcomeScreen = document.getElementById('welcome-screen');
        const countdownElement = document.getElementById('countdown');
        const progressFill = document.getElementById('progress-fill');
        const countdownText = document.getElementById('countdown-text');
        
        // Show welcome screen
        welcomeScreen.style.display = 'flex';
        welcomeScreen.style.opacity = '1';
        
        // Load logo
        const logoElement = document.getElementById('company-logo');
        if (logoElement) {
          // Handle logo loading error
          logoElement.onerror = function() {
            console.log('Logo failed to load, showing fallback');
            this.style.display = 'none';
            this.parentElement.innerHTML = '<div style="font-size: 3rem; font-weight: bold; color: white;">PWI</div>';
          };
        }
        
        let timeLeft = 15;
        const totalTime = 15;
        
        // Background music handling (optional)
        const backgroundMusic = document.getElementById('background-music');
        if (backgroundMusic) {
          const startMusic = () => {
            backgroundMusic.volume = 0.2;
            backgroundMusic.play().catch(e => {
              console.log('Autoplay prevented, user interaction required');
            });
          };
          
          document.addEventListener('click', startMusic, { once: true });
          document.addEventListener('touchstart', startMusic, { once: true });
        }
        
        // Start countdown
        countdownInterval = setInterval(() => {
          timeLeft--;
          countdownElement.textContent = timeLeft;
          countdownText.textContent = timeLeft;
          
          // Update progress bar
          const progressPercentage = ((totalTime - timeLeft) / totalTime) * 100;
          progressFill.style.width = `${progressPercentage}%`;
          
          if (timeLeft <= 0) {
            redirectToLogin();
          }
        }, 1000);
        
        // Skip button
        document.getElementById('skip-button').addEventListener('click', function() {
          markWelcomeScreenSkipped();
          redirectToLogin();
        });
      }
      
      // Initialize when DOM is loaded
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, initializing welcome screen...');
        
        // Check current URL - if already on login page, don't show welcome
        const currentPath = window.location.pathname;
        const isLoginPage = currentPath.includes('/login') || 
                           currentPath === '/' || 
                           currentPath === '';
        
        if (isLoginPage && !shouldShowWelcomeScreen()) {
          // Already on login page and shouldn't show welcome
          console.log('Already on login page, showing loading screen...');
          showLoadingScreen();
          setTimeout(triggerAppReady, 500);
        } else {
          // Start welcome screen
          startWelcomeScreen();
        }
      });
      
      // Global function for React to call when it's ready
      window.reactAppLoaded = function() {
        console.log('React app loaded successfully');
        
        // Hide any loading screens
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300);
        }
        
        // Update welcome screen if still visible
        const welcomeScreen = document.getElementById('welcome-screen');
        if (welcomeScreen && welcomeScreen.style.display !== 'none') {
          const countdownText = document.getElementById('countdown-text');
          if (countdownText) {
            countdownText.textContent = 'app loading...';
          }
        }
      };
      
      // Handle page visibility
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          document.title = 'Pakistan Wire Industries';
        }
      });
      
      // Performance monitoring
      window.addEventListener('load', function() {
        if (window.performance) {
          const perfData = window.performance.getEntriesByType('navigation')[0];
          console.log('Page loaded in: ' + (perfData.loadEventEnd - perfData.fetchStart) + 'ms');
        }
      });
    </script>
  </body>
</html>
